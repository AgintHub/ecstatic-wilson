dag_type: plain_text
description: Collects ticker symbols and stock data from NYSE, NASDAQ, Toronto Stock
  Exchange, and London Stock Exchange, stores the results, and generates a data quality
  report.
name: fetch_stock_data_workflow_with_toronto_lse
nodes:
  authorize_api_access:
    agent: false
    description: Retrieve authorized API keys for all exchanges.
    name: authorize_api_access
    nodes_depended_on: []
    nodes_dependent_on:
    - fetch_stock_data_nyse
    - fetch_stock_data_nasdaq
    - fetch_stock_data_toronto
    - fetch_stock_data_lse
    prompt: Fetch API keys for accessing NYSE, NASDAQ, Toronto Stock Exchange, and
      London Stock Exchange ticker data. Provide key formats and usage guidelines.
  configure_web_scraper:
    agent: false
    description: Set up the web scraper for metadata retrieval.
    name: configure_web_scraper
    nodes_depended_on: []
    nodes_dependent_on:
    - fetch_ticker_metadata
    prompt: Configure a web scraper to access NYSE, NASDAQ, Toronto Stock Exchange,
      and London Stock Exchange ticker metadata. Identify required headers, query
      parameters, and user agent headers.
  fetch_stock_data_lse:
    agent: false
    description: Retrieve London Stock Exchange data.
    name: fetch_stock_data_lse
    nodes_depended_on:
    - authorize_api_access
    nodes_dependent_on:
    - store_fetch_result
    prompt: Use the authorized API keys to fetch London Stock Exchange stock data
      for the compiled list of symbols. Store data in a database for later use.
  fetch_stock_data_nasdaq:
    agent: false
    description: Retrieve NASDAQ stock data.
    name: fetch_stock_data_nasdaq
    nodes_depended_on:
    - authorize_api_access
    nodes_dependent_on:
    - store_fetch_result
    prompt: Use the authorized API keys to fetch NASDAQ stock data for the compiled
      list of symbols. Store data in a database for later use.
  fetch_stock_data_nyse:
    agent: false
    description: Retrieve NYSE stock data.
    name: fetch_stock_data_nyse
    nodes_depended_on:
    - authorize_api_access
    nodes_dependent_on:
    - store_fetch_result
    prompt: Use the authorized API keys to fetch NYSE stock data for the compiled
      list of symbols. Store data in a database for later use.
  fetch_stock_data_toronto:
    agent: false
    description: Retrieve Toronto Stock Exchange data.
    name: fetch_stock_data_toronto
    nodes_depended_on:
    - authorize_api_access
    nodes_dependent_on:
    - store_fetch_result
    prompt: Use the authorized API keys to fetch Toronto Stock Exchange stock data
      for the compiled list of symbols. Store data in a database for later use.
  fetch_ticker_metadata:
    agent: false
    description: Retrieve and store ticker metadata from all exchanges.
    name: fetch_ticker_metadata
    nodes_depended_on:
    - configure_web_scraper
    nodes_dependent_on: []
    prompt: Use the web scraper to fetch ticker metadata for the compiled list of
      symbols. Store metadata in a database for later use.
  gather_ticker_symbols:
    agent: false
    description: Compile a comprehensive list of ticker symbols from all exchanges.
    name: gather_ticker_symbols
    nodes_depended_on:
    - resolve_api_endpoints
    nodes_dependent_on:
    - configure_web_scraper
    - authorize_api_access
    prompt: Create a list of all ticker symbols for NYSE, NASDAQ, Toronto Stock Exchange,
      and London Stock Exchange. Format symbols to match each API’s requirements.
  generate_data_quality_report:
    agent: false
    description: Generate a data quality report.
    name: generate_data_quality_report
    nodes_depended_on:
    - store_fetch_result
    nodes_dependent_on: []
    prompt: Analyze the stored stock data for quality issues and suggest improvements.
      Provide a report on data inconsistencies and missing information.
  resolve_api_endpoints:
    agent: false
    description: Identify the API endpoints needed for all exchanges.
    name: resolve_api_endpoints
    nodes_depended_on: []
    nodes_dependent_on:
    - gather_ticker_symbols
    prompt: List API endpoints for fetching NYSE, NASDAQ, Toronto Stock Exchange,
      and London Stock Exchange ticker data. Provide URLs and required parameters.
  store_fetch_result:
    agent: false
    description: Persist all fetched stock data.
    name: store_fetch_result
    nodes_depended_on:
    - fetch_stock_data_nyse
    - fetch_stock_data_nasdaq
    - fetch_stock_data_toronto
    - fetch_stock_data_lse
    nodes_dependent_on:
    - generate_data_quality_report
    prompt: Store the combined NYSE, NASDAQ, Toronto Stock Exchange, and London Stock
      Exchange stock data in a database for later analysis. Ensure data integrity
      and concurrency control.
